<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Assistant</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font:         "Segoe UI", system-ui, -apple-system, sans-serif;
  --teal-900:     #005A5A;
  --teal-700:     #008282;
  --teal-400:     #50C1C1;
  --teal-100:     #95DFDB;
  --amber:        #E1A01E;
  --red:          #C41E3A;
  --ink:          #012D2C;
  --text:         #005A5A;
  --text-muted:   #008282;
  --surface-page: #F0FAFA;
  --surface-card: #FFFFFF;
  --surface-in:   #F0FAFA;
  --border:       #D0ECEB;
  --shadow:       0 1px 4px rgba(1,45,44,.10);
  --shadow-md:    0 4px 14px rgba(1,45,44,.12);
  --r:            8px;
  --nav-h:        48px;
  --wrap:         1040px;
}

[data-theme="dark"] {
  --text:         #95DFDB;
  --text-muted:   #50C1C1;
  --surface-page: #012D2C;
  --surface-card: #032F2E;
  --surface-in:   #021E1E;
  --border:       #0A5050;
  --shadow:       0 1px 4px rgba(0,0,0,.40);
  --shadow-md:    0 4px 14px rgba(0,0,0,.50);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  font-size: 0.9375rem;
  color: var(--text);
  background: var(--surface-page);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background 200ms, color 200ms;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── NAVBAR ─────────────────────────────────────────── */
.navbar {
  display: flex;
  align-items: center;
  height: var(--nav-h);
  padding: 0 28px;
  background: var(--teal-900);
  border-bottom: 1px solid rgba(149,223,219,.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand-icon { display: flex; align-items: center; text-decoration: none; }
.nav-pipe { width: 1px; height: 16px; background: rgba(149,223,219,.30); margin: 0 12px; }
.nav-brand-text { font-size: 1rem; font-weight: 600; color: var(--teal-100); text-decoration: none; }

.nav-links-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.theme-btn {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  color: rgba(149,223,219,.75);
  background: rgba(149,223,219,.12);
  border: 1px solid rgba(149,223,219,.22);
  border-radius: 4px;
  padding: 4px 11px;
  cursor: pointer;
  transition: 130ms;
}
.theme-btn:hover { background: rgba(149,223,219,.22); border-color: rgba(149,223,219,.40); color: var(--teal-100); }

/* ── WRAPPER ────────────────────────────────────────── */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding: 20px 20px 32px;
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 14px;
}

/* ── TOP CONTROL BAR ────────────────────────────────── */
.card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 20px;
  box-shadow: var(--shadow);
}
.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: nowrap;
  gap: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.card-header-row::-webkit-scrollbar { display: none; }

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
  white-space: nowrap;
  flex-shrink: 0;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
  white-space: nowrap;
  flex-shrink: 0;
}

.card-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--teal-900);
  white-space: nowrap;
}
[data-theme="dark"] .card-title { color: var(--teal-100); }

.persona-select {
  height: 36px;
  width: auto;
  min-width: 110px;
  font-weight: 600;
  padding: 6px 10px;
  flex-shrink: 0;
}

/* ── STATUS & AUDIO METER ───────────────────────────── */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--surface-in);
  border: 1px solid var(--border);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #94a3b8;
}
.dot.connected { background: #1A7A4A; box-shadow: 0 0 0 2px rgba(26,122,74,.2); }
.dot.speaking  { background: var(--amber); box-shadow: 0 0 0 2px rgba(225,160,30,.2); }

.audio-meter {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 14px;
  flex-shrink: 0;
}
.audio-meter-bar {
  width: 3px;
  height: 4px;
  background: var(--border);
  border-radius: 1px;
  transition: height 0.06s ease, background 0.1s ease;
}
.audio-meter.active .audio-meter-bar { background: var(--teal-400); }

/* ── BUTTONS ─────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font);
  font-size: 0.875rem;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 130ms, border-color 130ms, opacity 130ms;
}
.btn:active { opacity: .88; }
.btn-primary { background: var(--teal-900); color: #fff; border-color: var(--teal-900); }
.btn-primary:hover { background: var(--teal-700); border-color: var(--teal-700); }
[data-theme="dark"] .btn-primary { background: var(--teal-400); color: var(--ink); border-color: var(--teal-400); }
[data-theme="dark"] .btn-primary:hover { background: var(--teal-100); border-color: var(--teal-100); }

.btn-secondary { background: transparent; color: var(--teal-900); border-color: var(--teal-900); }
.btn-secondary:hover { background: rgba(0,90,90,.05); }
[data-theme="dark"] .btn-secondary { color: var(--teal-400); border-color: var(--teal-400); }
[data-theme="dark"] .btn-secondary:hover { background: rgba(80,193,193,.1); }

.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover { background: #A01830; }

.btn-sm { padding: 5px 12px; font-size: 0.75rem; }

/* ── COLLAPSIBLE SETTINGS ACCORDION ─────────────────── */
.accordion {
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--surface-card);
  box-shadow: var(--shadow);
}
.accordion-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 16px;
  background: var(--surface-card);
  border: none;
  cursor: pointer;
  text-align: left;
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: background 130ms, color 130ms;
}
.accordion-trigger:hover { background: var(--surface-in); color: var(--text); }
.accordion-trigger[aria-expanded="true"] { background: var(--surface-in); color: var(--text); }
.accordion-chevron {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  transition: transform 200ms ease;
}
.accordion-trigger[aria-expanded="true"] .accordion-chevron { transform: rotate(180deg); }
.accordion-body {
  display: none;
  padding: 0 16px 16px;
  background: var(--surface-card);
  border-top: 1px solid var(--border);
}
.accordion-body.open { display: block; }
.accordion-body-inner {
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.settings-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.settings-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--teal-700);
  border-bottom: 1px dashed var(--border);
  padding-bottom: 6px;
}
[data-theme="dark"] .settings-section-header { color: var(--teal-400); }

.settings-grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 640px) { .settings-grid-2col { grid-template-columns: 1fr; } }

.field-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
  display: block;
}

.input {
  font-family: var(--font);
  font-size: 0.875rem;
  color: var(--text);
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  outline: none;
  width: 100%;
  height: 38px;
  transition: border-color 130ms, box-shadow 130ms;
}
select.input { cursor: pointer; }
.input::placeholder { color: #7A9E9E; }
.input:hover { border-color: var(--teal-700); }
.input:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }
[data-theme="dark"] .input { background: var(--surface-in); }
[data-theme="dark"] .input:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px rgba(80,193,193,.20); }

/* Volume Slider */
.volume-control-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 38px;
}
.volume-slider {
  flex: 1;
  accent-color: var(--teal-700);
  cursor: pointer;
}
[data-theme="dark"] .volume-slider { accent-color: var(--teal-400); }
.volume-val-display {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  min-width: 40px;
  text-align: right;
}

/* Tool Checkbox */
.tool-toggle-label {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}
.tool-toggle-label input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: var(--teal-700);
  cursor: pointer;
}
[data-theme="dark"] .tool-toggle-label input[type="checkbox"] {
  accent-color: var(--teal-400);
}

.textarea {
  font-family: var(--font);
  font-size: 0.85rem;
  color: var(--text);
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  outline: none;
  width: 100%;
  min-height: 110px;
  resize: vertical;
  line-height: 1.55;
}
.textarea:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }
[data-theme="dark"] .textarea { background: var(--surface-in); }
[data-theme="dark"] .textarea:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px rgba(80,193,193,.20); }

.persona-actions {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}

/* ── CHAT LOG ────────────────────────────────────────── */
.chat-window {
  flex: 1;
  min-height: 460px;
  max-height: calc(100vh - 270px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}

.msg {
  max-width: 82%;
  padding: 11px 16px;
  border-radius: 8px;
  font-size: 0.95rem;
  line-height: 1.55;
  word-break: break-word;
  box-shadow: 0 1px 3px rgba(1,45,44,.06);
}

.msg-user {
  align-self: flex-end;
  background: var(--teal-900);
  border: 1px solid var(--teal-700);
  color: #FFFFFF;
  border-bottom-right-radius: 2px;
}
[data-theme="dark"] .msg-user {
  background: #023838;
  border-color: var(--teal-700);
  color: #FFFFFF;
}
.msg-user .msg-speaker { color: var(--teal-100); }

.msg-assistant {
  align-self: flex-start;
  background: #FFFCF2;
  border: 1px solid rgba(225, 160, 30, 0.4);
  border-left: 4px solid var(--amber);
  color: var(--ink);
  border-bottom-left-radius: 2px;
}
[data-theme="dark"] .msg-assistant {
  background: #191404;
  border-color: rgba(225, 160, 30, 0.35);
  border-left-color: var(--amber);
  color: #FDF3D7;
}
.msg-assistant .msg-speaker { color: var(--amber); }

.msg-speaker {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 4px;
}

/* ── TOASTER ─────────────────────────────────────────── */
#toast-container {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 260px;
  max-width: 360px;
  padding: 11px 14px;
  border-radius: 6px;
  font-size: 0.8125rem;
  line-height: 1.45;
  box-shadow: 0 4px 18px rgba(1,45,44,.18);
  pointer-events: all;
  position: relative;
  overflow: hidden;
  animation: toast-in 200ms cubic-bezier(.22,1,.36,1) forwards;
}
.toast.removing { animation: toast-out 180ms ease-in forwards; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toast-out {
  from { opacity: 1; transform: translateY(0); max-height: 60px; }
  to   { opacity: 0; transform: translateY(12px); max-height: 0; margin-bottom: -8px; }
}
.toast-success { background: #005A5A; color: #fff; }
.toast-error   { background: #C41E3A; color: #fff; }
.toast-warning { background: #7A5000; color: #fff; }
.toast-info    { background: var(--surface-card); color: var(--text); border: 1px solid var(--border); }
.toast-body { flex: 1; }
.toast-title { font-weight: 600; font-size: 0.8125rem; }
.toast-msg   { font-size: 0.75rem; opacity: .85; margin-top: 1px; }
.toast-close {
  background: none; border: none; cursor: pointer; color: inherit; opacity: .6;
  font-size: 1rem; line-height: 1; padding: 0;
}
.toast-close:hover { opacity: 1; }
.toast-progress {
  position: absolute; bottom: 0; left: 0; height: 2px;
  background: rgba(255,255,255,.35);
  animation: toast-shrink linear forwards;
}
.toast-info .toast-progress { background: var(--teal-400); }
@keyframes toast-shrink { from { width: 100%; } to { width: 0%; } }

/* ── FOOTER ──────────────────────────────────────────── */
.footer {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8125rem;
  color: var(--text-muted);
}
.footer strong { color: var(--text); font-weight: 600; }
.footer-dot { margin: 0 10px; color: var(--border); }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="brand-icon" href="#" aria-label="Virtual Assistant">
    <svg width="24" height="17" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="0"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="0"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="0"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="8"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="8"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="8"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="16" width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"/>
    </svg>
  </a>
  <div class="nav-pipe"></div>
  <a class="nav-brand-text" href="#">Virtual Assistant</a>
  <div class="nav-links-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">Dark</button>
  </div>
</nav>

<div class="wrap">

  <!-- TOP BAR: ALL CONTROLS LOCKED ONTO A SINGLE LINE -->
  <div class="card">
    <div class="card-header-row">
      <div class="header-left">
        <div class="card-title">Virtual Assistant</div>
        <select id="personaSelect" class="input persona-select" aria-label="Select Assistant">
          <!-- Populated dynamically -->
        </select>
      </div>

      <div class="header-right">
        <div class="audio-meter" id="audioMeter" title="Microphone Activity">
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
        </div>

        <div class="status-pill">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Disconnected</span>
        </div>

        <button id="toggleBtn" class="btn btn-primary" onclick="toggleSession()">
          Start Conversation
        </button>
      </div>
    </div>
  </div>

  <!-- COLLAPSIBLE SETTINGS ACCORDION -->
  <div class="accordion">
    <button class="accordion-trigger" id="settingsToggle" aria-expanded="false" onclick="toggleAccordion(this)">
      <span>Settings</span>
      <svg class="accordion-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 7 9 12 14 7"/></svg>
    </button>
    <div class="accordion-body">
      <div class="accordion-body-inner">

        <!-- Access Keys Section -->
        <div class="settings-section">
          <div class="settings-section-header">Access Keys</div>
          <div class="settings-grid-2col">
            <div>
              <label class="field-label">Gemini API Key</label>
              <input type="password" id="apiKey" class="input" placeholder="Enter Gemini key...">
            </div>
            <div>
              <label class="field-label">GitHub PAT</label>
              <input type="password" id="ghToken" class="input" placeholder="ghp_...">
            </div>
          </div>
        </div>

        <!-- Persona Configuration Section -->
        <div class="settings-section">
          <div class="settings-section-header">Persona Configuration</div>
          <div class="settings-grid-2col">
            <div>
              <label class="field-label">Live Conversational Model</label>
              <select id="modelSelect" class="input">
                <option value="models/gemini-3.8-live">Gemini 3.8 Live (Default)</option>
                <option value="models/gemini-2.5-flash-native-audio-latest">Gemini 2.5 Flash Native Audio (Fallback)</option>
                <option value="models/gemini-2.0-flash-exp">Gemini 2.0 Flash Exp</option>
                <option value="models/gemini-3.1-flash-live-preview">Gemini 3.1 Flash Live Preview</option>
              </select>
            </div>
            <div>
              <label class="field-label">Input Language</label>
              <select id="langSelect" class="input">
                <option value="de-DE">German (de-DE)</option>
                <option value="fr-FR">French (fr-FR)</option>
                <option value="en-US">English (en-US)</option>
                <option value="es-ES">Spanish (es-ES)</option>
                <option value="pl-PL">Polish (pl-PL)</option>
              </select>
            </div>
            <div>
              <label class="field-label">Gemini Live Voice</label>
              <select id="voiceSelect" class="input">
                <option value="Aoede">Aoede (Female - Breezy)</option>
                <option value="Kore">Kore (Female - Firm)</option>
                <option value="Autonoe">Autonoe (Female - Bright)</option>
                <option value="Achernar">Achernar (Female - Soft)</option>
                <option value="Zephyr">Zephyr (Female - Bright)</option>
                <option value="Charon">Charon (Male - Smooth)</option>
                <option value="Puck">Puck (Male - Upbeat)</option>
                <option value="Fenrir">Fenrir (Male - Excitable)</option>
                <option value="Orus">Orus (Male - Firm)</option>
                <option value="Algieba">Algieba (Male - Smooth)</option>
              </select>
            </div>
            <div>
              <label class="field-label">Volume</label>
              <div class="volume-control-wrapper">
                <input type="range" id="volumeControl" class="volume-slider" min="0" max="100" value="100">
                <span id="volumeVal" class="volume-val-display">100%</span>
              </div>
            </div>
            <div style="grid-column: 1 / -1;">
              <label class="tool-toggle-label">
                <input type="checkbox" id="googleSearchToggle" checked>
                <span>Enable Google Search</span>
              </label>
            </div>
          </div>
          <div>
            <label class="field-label">Metaprompt (System Instruction)</label>
            <textarea id="systemPrompt" class="textarea"></textarea>
          </div>
          <div class="persona-actions">
            <button class="btn btn-secondary btn-sm" onclick="saveCurrentPersona()">Save</button>
            <button class="btn btn-primary btn-sm" onclick="saveAsNewPersona()">Save as New</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- CHAT WINDOW (Pure spoken speech only) -->
  <div class="chat-window" id="chat"></div>

</div>

<!-- FOOTER -->

/* ── BASE64 UTF-8 HELPERS ───────────────────────────── */
function encodeUTF8toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
  return btoa(binString);
}
function decodeBase64toUTF8(b64) {
  const binString = atob(b64);
  const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
  return new TextDecoder().decode(bytes);
}

/* ── GITHUB API LOGIC ───────────────────────────────── */
let githubFileSha = null;

async function fetchPersonasFromGitHub() {
  const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}?ref=main`;
  const token = ghTokenInput.value.trim();
  const headers = { 'Accept': 'application/vnd.github.v3+json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;

  try {
    const res = await fetch(url, { headers });
    if (res.status === 404) {
      console.info('settings/personas.json not found on GitHub. Using defaults.');
      populatePersonaDropdown();
      return;
    }
    if (!res.ok) throw new Error(`GitHub API Error: ${res.statusText}`);
    
    const data = await res.json();
    githubFileSha = data.sha;
    const jsonStr = decodeBase64toUTF8(data.content);
    
    const fetchedPersonas = JSON.parse(jsonStr);
    if (Object.keys(fetchedPersonas).length > 0) {
      PRESETS = fetchedPersonas;
    }
  } catch (err) {
    console.error("GitHub Sync Failed:", err);
  }
  populatePersonaDropdown();
}

async function savePersonasToGitHub() {
  const token = ghTokenInput.value.trim();
  
  if (!token) {
    toast('error', 'GitHub Token Missing', 'Please enter your GitHub PAT to save changes.');
    return;
  }

  const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
  const jsonStr = JSON.stringify(PRESETS, null, 2);
  const base64Content = encodeUTF8toBase64(jsonStr);

  const payload = {
    message: "Update personas via Virtual Assistant",
    content: base64Content,
    branch: "main"
  };
  if (githubFileSha) {
    payload.sha = githubFileSha;
  }

  try {
    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      if (res.status === 409) {
        toast('error', 'Conflict Error', 'File was modified elsewhere. Refresh to pull latest.');
      } else {
        throw new Error(`GitHub API Error: ${res.statusText}`);
      }
      return;
    }

    const data = await res.json();
    githubFileSha = data.content.sha; // Update SHA for future saves
    toast('success', 'Saved', 'Persona configuration committed to GitHub.');
  } catch (err) {
    console.error(err);
    toast('error', 'Save Failed', err.message);
  }
}

/* ── DYNAMIC MODEL DETECTION ── */
async function detectAvailableLiveModels(key, silent = false) {
  if (!key) return;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}&pageSize=100`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    const liveModels = (data.models || []).filter(m => {
      const isBidi = Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes("bidiGenerateContent");
      const name = (m.name || "").toLowerCase();
      const displayName = (m.displayName || "").toLowerCase();
      const isTranslate = name.includes("translate") || displayName.includes("translate");
      const isTranscribe = name.includes("transcribe") || displayName.includes("transcribe");
      return isBidi && !isTranslate && !isTranscribe;
    });

    if (liveModels.length > 0) {
      const currentSelected = modelSelect.value;
      modelSelect.innerHTML = "";
      
      liveModels.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.name;
        opt.textContent = `${m.displayName || m.name.replace("models/", "")}`;
        modelSelect.appendChild(opt);
      });

      if (!liveModels.some(m => m.name === FALLBACK_MODEL)) {
        const fallbackOpt = document.createElement("option");
        fallbackOpt.value = FALLBACK_MODEL;
        fallbackOpt.textContent = "Gemini 2.5 Flash Native Audio (Fallback)";
        modelSelect.appendChild(fallbackOpt);
      }

      // Ensure the active persona's model stays selected if possible
      if (![...modelSelect.options].some(o => o.value === currentSelected)) {
        const opt = document.createElement("option");
        opt.value = currentSelected;
        opt.textContent = currentSelected.replace("models/", "");
        modelSelect.appendChild(opt);
      }
      modelSelect.value = currentSelected;
    }
  } catch (err) {
    if (!silent) console.error("Model Detection Failed", err.message);
  }
}

/* ── TOASTER ────────────────────────────────────────── */
const TOAST_ICONS = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
const TOAST_CLASSES = { success: 'toast-success', error: 'toast-error', warning: 'toast-warning', info: 'toast-info' };
function toast(type, title, msg, duration = 4000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + (TOAST_CLASSES[type] || 'toast-info');
  el.innerHTML =
    '<div class="toast-body">' +
      '<div class="toast-title">' + (TOAST_ICONS[type] ? TOAST_ICONS[type] + ' ' : '') + title + '</div>' +
      (msg ? '<div class="toast-msg">' + msg + '</div>' : '') +
    '</div>' +
    '<button class="toast-close" onclick="dismissToast(this.parentElement)">×</button>' +
    '<div class="toast-progress" style="animation-duration:' + duration + 'ms"></div>';
  container.appendChild(el);
  const timer = setTimeout(() => dismissToast(el), duration);
  el._timer = timer;
}
function dismissToast(el) {
  if (!el || !el.parentElement) return;
  clearTimeout(el._timer);
  el.classList.add('removing');
  el.addEventListener('animationend', () => el.remove(), { once: true });
}

/* ── APPLICATION STATE ─────────────────────────────── */
let ws = null;
let micStream = null;
let audioContext = null;
let processor = null;
let playbackCtx = null;
let playbackGainNode = null;
let currentVolume = 1;
let nextPlayTime = 0;
let activeSources = [];

let isConnected = false;
let isSetupComplete = false;
let isAssistantSpeaking = false;
let isFallingBack = false;

let currentUserMsgEl = null;
let currentAssistantMsgEl = null;

function setStatus(text, dotClass = "") {
  document.getElementById("statusText").innerText = text;
  document.getElementById("statusDot").className = "dot " + dotClass;
}

function getAssistantSpeakerLabel() {
  const currentP = personaSelect.value;
  return PRESETS[currentP] ? PRESETS[currentP].name : 'Assistant';
}

function appendMessage(sender, text = "") {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `msg msg-${sender}`;
  const speakerLabel = sender === 'user' ? 'You' : getAssistantSpeakerLabel();
  msg.innerHTML = `<div class="msg-speaker">${speakerLabel}</div><div class="content">${text}</div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg.querySelector(".content");
}

function checkIsQuotaError(reason = "", code = 0, status = "") {
  const text = (String(reason) + " " + String(code) + " " + String(status)).toLowerCase();
  return (
    text.includes("quota") ||
    text.includes("resource_exhausted") ||
    text.includes("resourceexhausted") ||
    text.includes("rate limit") ||
    text.includes("ratelimit") ||
    text.includes("exceeded") ||
    text.includes("429")
  );
}

async function triggerFallback() {
  isFallingBack = true;
  toast('warning', 'Quota Reached', 'Switching automatically to fallback: Gemini 2.5 Flash Native Audio...', 5000);

  if (![...modelSelect.options].some(o => o.value === FALLBACK_MODEL)) {
    const opt = document.createElement("option");
    opt.value = FALLBACK_MODEL;
    opt.textContent = "Gemini 2.5 Flash Native Audio (Fallback)";
    modelSelect.appendChild(opt);
  }
  modelSelect.value = FALLBACK_MODEL;
  
  if (ws) {
    ws.onclose = null;
    ws.onerror = null;
    ws.close();
    ws = null;
  }
  stopAudioPlayback();
  isSetupComplete = false;
  setStatus("Switching to Gemini 2.5...", "");

  setTimeout(async () => {
    try {
      await connectWebSocket(FALLBACK_MODEL);
    } catch (e) {
      toast('error', 'Fallback Failed', e.message);
      stopSession();
    }
  }, 250);
}

async function toggleSession() {
  if (isConnected) stopSession();
  else await startSession();
}

async function startSession() {
  const key = apiKeyInput.value.trim();
  const currentP = personaSelect.value;
  const model = modelSelect ? modelSelect.value : (PRESETS[currentP]?.model || DEFAULT_MODEL);

  if (!key) {
    toast('warning', 'API Key Missing', 'Please enter your Gemini API key in the settings panel.');
    const trigger = document.getElementById("settingsToggle");
    if (trigger.getAttribute("aria-expanded") !== "true") toggleAccordion(trigger);
    apiKeyInput.focus();
    return;
  }

  isFallingBack = false;
  setStatus("Starting microphone...", "");
  const toggleBtn = document.getElementById("toggleBtn");
  toggleBtn.innerText = "Connecting...";
  toggleBtn.disabled = true;
  personaSelect.disabled = true;
  modelSelect.disabled = true;

  try {
    await initMicrophone();
  } catch (err) {
    toast('error', 'Microphone Error', err.message);
    stopSession();
    return;
  }

  await connectWebSocket(model);
}

async function connectWebSocket(activeModel) {
  const key = apiKeyInput.value.trim();
  const lang = langSelect.value;
  const currentP = personaSelect.value;
  let voice = voiceSelect ? voiceSelect.value : (PRESETS[currentP]?.voice || DEFAULT_VOICE);
  
  if (!VALID_GEMINI_VOICES.includes(voice)) voice = DEFAULT_VOICE;

  const instruction = promptInput.value.trim() || (PRESETS[currentP] ? PRESETS[currentP].instruction : "");
  const enableSearch = googleSearchToggle.checked;
  const toggleBtn = document.getElementById("toggleBtn");

  setStatus("Connecting...", "");

  const endpoint = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${key}`;
  ws = new WebSocket(endpoint);

  ws.onopen = () => {
    const tools = [];
    if (enableSearch) tools.push({ googleSearch: {} });

    const setupMessage = {
      setup: {
        model: activeModel,
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: voice }
            }
          }
        },
        ...(tools.length > 0 ? { tools } : {}),
        inputAudioTranscription: { languageCodes: [lang] },
        outputAudioTranscription: {},
        systemInstruction: { parts: [{ text: instruction }] }
      }
    };

    ws.send(JSON.stringify(setupMessage));
    isConnected = true;
    toggleBtn.disabled = false;
    toggleBtn.innerText = "End Conversation";
    toggleBtn.className = "btn btn-danger";
    setStatus("Waiting for server...", "");
  };

  ws.onmessage = async (event) => {
    let msg;
    try {
      if (event.data instanceof Blob) {
        msg = JSON.parse(await event.data.text());
      } else {
        msg = JSON.parse(event.data);
      }
    } catch (e) {
      return;
    }

    if (msg.error) {
      const errMsg = msg.error.message || JSON.stringify(msg.error);
      const isQuota = checkIsQuotaError(errMsg, msg.error.code, msg.error.status);
      if (isQuota && activeModel !== FALLBACK_MODEL && !isFallingBack) {
        triggerFallback();
        return;
      }
      toast('error', 'API Error', errMsg);
      stopSession();
      return;
    }

    if (msg.setupComplete) {
      isSetupComplete = true;
      setStatus("Ready! Speak now", "connected");
      if (isFallingBack) {
        toast('success', 'Fallback Active', 'Connected to Gemini 2.5 Flash Native Audio.');
        isFallingBack = false;
      } else {
        toast('success', 'Connected', 'Conversation session is active.');
      }
      return;
    }

    const serverContent = msg.serverContent;
    if (!serverContent) return;

    const userText = serverContent.inputTranscription?.text;
    if (userText && userText.trim()) {
      if (!currentUserMsgEl) currentUserMsgEl = appendMessage("user");
      currentUserMsgEl.textContent += userText;
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    if (serverContent.modelTurn?.parts) {
      isAssistantSpeaking = true;
      currentUserMsgEl = null;
      setStatus(`${getAssistantSpeakerLabel()} is speaking...`, "speaking");

      for (const part of serverContent.modelTurn.parts) {
        if (part.inlineData?.data) {
          playAudioChunk(part.inlineData.data);
        }
      }
    }

    const assistantText = serverContent.outputTranscription?.text;
    if (assistantText) {
      currentUserMsgEl = null;
      if (!currentAssistantMsgEl) currentAssistantMsgEl = appendMessage("assistant");
      currentAssistantMsgEl.textContent += assistantText;
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    if (serverContent.interrupted) {
      stopAudioPlayback();
      currentAssistantMsgEl = null;
    }

    if (serverContent.turnComplete) {
      currentAssistantMsgEl = null;
    }
  };

  ws.onerror = (e) => console.error("WebSocket Error:", e);

  ws.onclose = (event) => {
    if (event.code !== 1000) {
      const isQuota = checkIsQuotaError(event.reason, event.code);
      if (isQuota && activeModel !== FALLBACK_MODEL && !isFallingBack) {
        triggerFallback();
        return;
      }
      let extra = event.reason || 'Check your API key and connection.';
      toast('error', `Disconnected (${event.code})`, extra, 6000);
    }
    stopSession();
  };
}

async function initMicrophone() {
  if (micStream && audioContext && processor) return;

  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === "suspended") await audioContext.resume();

  const source = audioContext.createMediaStreamSource(micStream);
  processor = audioContext.createScriptProcessor(4096, 1, 1);

  const meter = document.getElementById("audioMeter");
  const meterBars = meter.querySelectorAll(".audio-meter-bar");

  processor.onaudioprocess = (e) => {
    const inputData = e.inputBuffer.getChannelData(0);

    let sum = 0;
    for (let i = 0; i < inputData.length; i++) sum += inputData[i] * inputData[i];
    const rms = Math.sqrt(sum / inputData.length);
    const level = Math.min(5, Math.ceil(rms * 120));

    meter.classList.toggle("active", level > 0);
    meterBars.forEach((bar, idx) => {
      bar.style.height = (idx < level) ? `${6 + idx * 2}px` : `4px`;
    });

    if (!isConnected || !isSetupComplete || isAssistantSpeaking || !ws || ws.readyState !== WebSocket.OPEN) {
      return;
    }

    const resampledData = downsample(inputData, audioContext.sampleRate, 16000);
    const pcm16 = floatTo16BitPCM(resampledData);
    const base64Audio = arrayBufferToBase64(pcm16);

    try {
      ws.send(JSON.stringify({
        realtimeInput: { audio: { mimeType: "audio/pcm;rate=16000", data: base64Audio } }
      }));
    } catch (err) {}
  };

  source.connect(processor);
  const mute = audioContext.createGain();
  mute.gain.value = 0;
  processor.connect(mute);
  mute.connect(audioContext.destination);
}

function playAudioChunk(base64PCM) {
  if (!playbackCtx) {
    playbackCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    playbackGainNode = playbackCtx.createGain();
    playbackGainNode.gain.setValueAtTime(currentVolume, playbackCtx.currentTime);
    playbackGainNode.connect(playbackCtx.destination);
  }
  if (playbackCtx.state === "suspended") playbackCtx.resume();

  const binary = atob(base64PCM);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

  const audioBuffer = playbackCtx.createBuffer(1, float32.length, 24000);
  audioBuffer.copyToChannel(float32, 0);

  const source = playbackCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(playbackGainNode);

  const now = playbackCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;

  source.start(nextPlayTime);
  nextPlayTime += audioBuffer.duration;

  activeSources.push(source);
  source.onended = () => {
    activeSources = activeSources.filter(s => s !== source);
    if (activeSources.length === 0 && nextPlayTime <= playbackCtx.currentTime + 0.05) {
      isAssistantSpeaking = false;
      setStatus("Ready! Speak now", "connected");
    }
  };
}

function stopAudioPlayback() {
  activeSources.forEach(s => { try { s.stop(); } catch(e){} });
  activeSources = [];
  if (playbackCtx) nextPlayTime = playbackCtx.currentTime;
  isAssistantSpeaking = false;
}

function stopSession() {
  isConnected = false;
  isSetupComplete = false;
  isAssistantSpeaking = false;
  isFallingBack = false;
  currentUserMsgEl = null;
  currentAssistantMsgEl = null;

  stopAudioPlayback();

  const meter = document.getElementById("audioMeter");
  meter.classList.remove("active");
  meter.querySelectorAll(".audio-meter-bar").forEach(b => b.style.height = "4px");

  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
    processor = null;
  }
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (ws) {
    ws.onclose = null;
    ws.onerror = null;
    ws.close();
    ws = null;
  }

  const toggleBtn = document.getElementById("toggleBtn");
  toggleBtn.disabled = false;
  toggleBtn.innerText = "Start Conversation";
  toggleBtn.className = "btn btn-primary";
  personaSelect.disabled = false;
  modelSelect.disabled = false;
  setStatus("Disconnected", "");
}

function downsample(buffer, fromRate, toRate) {
  if (fromRate === toRate) return buffer;
  const ratio = fromRate / toRate;
  const newLength = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLength);
  for (let i = 0; i < newLength; i++) {
    result[i] = buffer[Math.min(Math.round(i * ratio), buffer.length - 1)];
  }
  return result;
}

function floatTo16BitPCM(input) {
  const buffer = new ArrayBuffer(input.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < input.length; i++) {
    let s = Math.max(-1, Math.min(1, input[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

function arrayBufferToBase64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
