<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Assistant</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font:         "Segoe UI", system-ui, -apple-system, sans-serif;
  --teal-900:     #005A5A;
  --teal-700:     #008282;
  --teal-400:     #50C1C1;
  --teal-100:     #95DFDB;
  --amber:        #E1A01E;
  --red:          #C41E3A;
  --ink:          #012D2C;
  --text:         #005A5A;
  --text-muted:   #008282;
  --surface-page: #F0FAFA;
  --surface-card: #FFFFFF;
  --surface-in:   #F0FAFA;
  --border:       #D0ECEB;
  --shadow:       0 1px 4px rgba(1,45,44,.10);
  --shadow-md:    0 4px 14px rgba(1,45,44,.12);
  --r:            8px;
  --nav-h:        48px;
  --wrap:         1040px;
}

[data-theme="dark"] {
  --text:         #95DFDB;
  --text-muted:   #50C1C1;
  --surface-page: #012D2C;
  --surface-card: #032F2E;
  --surface-in:   #021E1E;
  --border:       #0A5050;
  --shadow:       0 1px 4px rgba(0,0,0,.40);
  --shadow-md:    0 4px 14px rgba(0,0,0,.50);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  font-size: 0.9375rem;
  color: var(--text);
  background: var(--surface-page);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background 200ms, color 200ms;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── NAVBAR ─────────────────────────────────────────── */
.navbar {
  display: flex;
  align-items: center;
  height: var(--nav-h);
  padding: 0 28px;
  background: var(--teal-900);
  border-bottom: 1px solid rgba(149,223,219,.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand-icon { display: flex; align-items: center; text-decoration: none; }
.nav-pipe { width: 1px; height: 16px; background: rgba(149,223,219,.30); margin: 0 12px; }
.nav-brand-text { font-size: 1rem; font-weight: 600; color: var(--teal-100); text-decoration: none; }

.nav-links-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.theme-btn {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  color: rgba(149,223,219,.75);
  background: rgba(149,223,219,.12);
  border: 1px solid rgba(149,223,219,.22);
  border-radius: 4px;
  padding: 4px 11px;
  cursor: pointer;
  transition: 130ms;
}
.theme-btn:hover { background: rgba(149,223,219,.22); border-color: rgba(149,223,219,.40); color: var(--teal-100); }

/* ── WRAPPER ────────────────────────────────────────── */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding: 20px 20px 32px;
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 14px;
}

/* ── TOP CONTROL BAR (STRICT SINGLE LINE) ───────────── */
.card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 20px;
  box-shadow: var(--shadow);
}
.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: nowrap;
  gap: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.card-header-row::-webkit-scrollbar { display: none; }

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
  white-space: nowrap;
  flex-shrink: 0;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
  white-space: nowrap;
  flex-shrink: 0;
}

.card-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--teal-900);
  white-space: nowrap;
}
[data-theme="dark"] .card-title { color: var(--teal-100); }

.persona-select {
  height: 36px;
  width: auto;
  min-width: 110px;
  font-weight: 600;
  padding: 6px 10px;
  flex-shrink: 0;
}

/* ── STATUS & AUDIO METER ───────────────────────────── */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--surface-in);
  border: 1px solid var(--border);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #94a3b8;
}
.dot.connected { background: #1A7A4A; box-shadow: 0 0 0 2px rgba(26,122,74,.2); }
.dot.speaking  { background: var(--amber); box-shadow: 0 0 0 2px rgba(225,160,30,.2); }

.audio-meter {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 14px;
  flex-shrink: 0;
}
.audio-meter-bar {
  width: 3px;
  height: 4px;
  background: var(--border);
  border-radius: 1px;
  transition: height 0.06s ease, background 0.1s ease;
}
.audio-meter.active .audio-meter-bar { background: var(--teal-400); }

/* ── BUTTONS ─────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font);
  font-size: 0.875rem;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 130ms, border-color 130ms, opacity 130ms;
}
.btn:active { opacity: .88; }
.btn-primary { background: var(--teal-900); color: #fff; border-color: var(--teal-900); }
.btn-primary:hover { background: var(--teal-700); border-color: var(--teal-700); }
[data-theme="dark"] .btn-primary { background: var(--teal-400); color: var(--ink); border-color: var(--teal-400); }
[data-theme="dark"] .btn-primary:hover { background: var(--teal-100); border-color: var(--teal-100); }

.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover { background: #A01830; }

/* ── COLLAPSIBLE SETTINGS ACCORDION ─────────────────── */
.accordion {
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--surface-card);
  box-shadow: var(--shadow);
}
.accordion-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 16px;
  background: var(--surface-card);
  border: none;
  cursor: pointer;
  text-align: left;
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: background 130ms, color 130ms;
}
.accordion-trigger:hover { background: var(--surface-in); color: var(--text); }
.accordion-trigger[aria-expanded="true"] { background: var(--surface-in); color: var(--text); }
.accordion-chevron {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  transition: transform 200ms ease;
}
.accordion-trigger[aria-expanded="true"] .accordion-chevron { transform: rotate(180deg); }
.accordion-body {
  display: none;
  padding: 0 16px 16px;
  background: var(--surface-card);
  border-top: 1px solid var(--border);
}
.accordion-body.open { display: block; }
.accordion-body-inner {
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.settings-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.settings-section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--teal-700);
  border-bottom: 1px dashed var(--border);
  padding-bottom: 6px;
}
[data-theme="dark"] .settings-section-header { color: var(--teal-400); }

.settings-grid-general {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 12px;
}
@media (max-width: 640px) { .settings-grid-general { grid-template-columns: 1fr; } }

.settings-grid-lang-voice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 640px) { .settings-grid-lang-voice { grid-template-columns: 1fr; } }

.field-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
  display: block;
}

.input {
  font-family: var(--font);
  font-size: 0.875rem;
  color: var(--text);
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  outline: none;
  width: 100%;
  height: 38px;
  transition: border-color 130ms, box-shadow 130ms;
}
select.input { cursor: pointer; }
.input::placeholder { color: #7A9E9E; }
.input:hover { border-color: var(--teal-700); }
.input:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }
[data-theme="dark"] .input { background: var(--surface-in); }
[data-theme="dark"] .input:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px rgba(80,193,193,.20); }

/* Volume Slider */
.volume-control-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 38px;
}
.volume-slider {
  flex: 1;
  accent-color: var(--teal-700);
  cursor: pointer;
}
[data-theme="dark"] .volume-slider { accent-color: var(--teal-400); }
.volume-val-display {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  min-width: 40px;
  text-align: right;
}

.textarea {
  font-family: var(--font);
  font-size: 0.85rem;
  color: var(--text);
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  outline: none;
  width: 100%;
  min-height: 110px;
  resize: vertical;
  line-height: 1.55;
}
.textarea:focus { border-color: var(--teal-700); box-shadow: 0 0 0 3px rgba(0,130,130,.15); }
[data-theme="dark"] .textarea { background: var(--surface-in); }
[data-theme="dark"] .textarea:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px rgba(80,193,193,.20); }

/* ── CHAT LOG ────────────────────────────────────────── */
.chat-window {
  flex: 1;
  min-height: 460px;
  max-height: calc(100vh - 270px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}

.msg {
  max-width: 82%;
  padding: 11px 16px;
  border-radius: 8px;
  font-size: 0.95rem;
  line-height: 1.55;
  word-break: break-word;
  box-shadow: 0 1px 3px rgba(1,45,44,.06);
}

/* User Message */
.msg-user {
  align-self: flex-end;
  background: var(--teal-900);
  border: 1px solid var(--teal-700);
  color: #FFFFFF;
  border-bottom-right-radius: 2px;
}
[data-theme="dark"] .msg-user {
  background: #023838;
  border-color: var(--teal-700);
  color: #FFFFFF;
}
.msg-user .msg-speaker { color: var(--teal-100); }

/* Assistant Message */
.msg-assistant {
  align-self: flex-start;
  background: #FFFCF2;
  border: 1px solid rgba(225, 160, 30, 0.4);
  border-left: 4px solid var(--amber);
  color: var(--ink);
  border-bottom-left-radius: 2px;
}
[data-theme="dark"] .msg-assistant {
  background: #191404;
  border-color: rgba(225, 160, 30, 0.35);
  border-left-color: var(--amber);
  color: #FDF3D7;
}
.msg-assistant .msg-speaker { color: var(--amber); }

.msg-speaker {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 4px;
}

/* ── TOASTER ─────────────────────────────────────────── */
#toast-container {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 260px;
  max-width: 360px;
  padding: 11px 14px;
  border-radius: 6px;
  font-size: 0.8125rem;
  line-height: 1.45;
  box-shadow: 0 4px 18px rgba(1,45,44,.18);
  pointer-events: all;
  position: relative;
  overflow: hidden;
  animation: toast-in 200ms cubic-bezier(.22,1,.36,1) forwards;
}
.toast.removing { animation: toast-out 180ms ease-in forwards; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toast-out {
  from { opacity: 1; transform: translateY(0); max-height: 60px; }
  to   { opacity: 0; transform: translateY(12px); max-height: 0; margin-bottom: -8px; }
}
.toast-success { background: #005A5A; color: #fff; }
.toast-error   { background: #C41E3A; color: #fff; }
.toast-warning { background: #7A5000; color: #fff; }
.toast-info    { background: var(--surface-card); color: var(--text); border: 1px solid var(--border); }
.toast-body { flex: 1; }
.toast-title { font-weight: 600; font-size: 0.8125rem; }
.toast-msg   { font-size: 0.75rem; opacity: .85; margin-top: 1px; }
.toast-close {
  background: none; border: none; cursor: pointer; color: inherit; opacity: .6;
  font-size: 1rem; line-height: 1; padding: 0;
}
.toast-close:hover { opacity: 1; }
.toast-progress {
  position: absolute; bottom: 0; left: 0; height: 2px;
  background: rgba(255,255,255,.35);
  animation: toast-shrink linear forwards;
}
.toast-info .toast-progress { background: var(--teal-400); }
@keyframes toast-shrink { from { width: 100%; } to { width: 0%; } }

/* ── FOOTER ──────────────────────────────────────────── */
.footer {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  border-top: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8125rem;
  color: var(--text-muted);
}
.footer strong { color: var(--text); font-weight: 600; }
.footer-dot { margin: 0 10px; color: var(--border); }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="brand-icon" href="#" aria-label="Virtual Assistant">
    <svg width="24" height="17" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="0"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="0"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="0"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="8"  width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="8"  width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="8"  width="9" height="6" rx="1.5" fill="#008282"/>
      <rect x="0"  y="16" width="9" height="6" rx="1.5" fill="#95DFDB"/>
      <rect x="11" y="16" width="9" height="6" rx="1.5" fill="#50C1C1"/>
      <rect x="22" y="16" width="9" height="6" rx="1.5" fill="#E1A01E"/>
    </svg>
  </a>
  <div class="nav-pipe"></div>
  <a class="nav-brand-text" href="#">Virtual Assistant</a>
  <div class="nav-links-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">Dark</button>
  </div>
</nav>

<div class="wrap">

  <!-- TOP BAR: ALL CONTROLS LOCKED ONTO A SINGLE LINE -->
  <div class="card">
    <div class="card-header-row">
      <div class="header-left">
        <div class="card-title">Virtual Assistant</div>
        <select id="personaSelect" class="input persona-select" aria-label="Select Assistant">
          <option value="helga">Helga</option>
          <option value="jean-paul">Jean-Paul</option>
        </select>
      </div>

      <div class="header-right">
        <div class="audio-meter" id="audioMeter" title="Microphone Activity">
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
          <div class="audio-meter-bar"></div>
        </div>

        <div class="status-pill">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Disconnected</span>
        </div>

        <button id="toggleBtn" class="btn btn-primary" onclick="toggleSession()">
          Start Conversation
        </button>
      </div>
    </div>
  </div>

  <!-- COLLAPSIBLE SETTINGS ACCORDION -->
  <div class="accordion">
    <button class="accordion-trigger" id="settingsToggle" aria-expanded="false" onclick="toggleAccordion(this)">
      <span>Settings</span>
      <svg class="accordion-chevron" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 7 9 12 14 7"/></svg>
    </button>
    <div class="accordion-body">
      <div class="accordion-body-inner">

        <!-- General Settings Section -->
        <div class="settings-section">
          <div class="settings-section-header">General Settings</div>
          <div class="settings-grid-general">
            <div>
              <label class="field-label">Gemini API Key</label>
              <input type="password" id="apiKey" class="input" placeholder="Enter API key...">
            </div>
            <div>
              <label class="field-label">Volume</label>
              <div class="volume-control-wrapper">
                <input type="range" id="volumeControl" class="volume-slider" min="0" max="100" value="100">
                <span id="volumeVal" class="volume-val-display">100%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Dedicated Language & Metaprompt Section -->
        <div class="settings-section">
          <div class="settings-section-header">Language & Metaprompt Configuration</div>
          <div class="settings-grid-lang-voice">
            <div>
              <label class="field-label">Input Language</label>
              <select id="langSelect" class="input">
                <option value="de-DE">German (de-DE)</option>
                <option value="fr-FR">French (fr-FR)</option>
                <option value="en-US">English (en-US)</option>
                <option value="pl-PL">Polish (pl-PL)</option>
              </select>
            </div>
            <div>
              <label class="field-label">Assistant Voice</label>
              <select id="voiceSelect" class="input">
                <option value="Charon">Charon (Male)</option>
                <option value="Puck">Puck (Male)</option>
                <option value="Fenrir">Fenrir (Male)</option>
                <option value="Aoede">Aoede (Female)</option>
                <option value="Kore">Kore (Female)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="field-label">Metaprompt (System Instruction)</label>
            <textarea id="systemPrompt" class="textarea"></textarea>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- CHAT WINDOW (Pure spoken speech only) -->
  <div class="chat-window" id="chat"></div>

</div>

<!-- FOOTER -->
<footer class="footer">
  <span><strong>Virtual Assistant</strong></span>
  <span class="footer-dot">·</span>
  <span>Roman Zajic</span>
</footer>

<script>
/* ── CONSTANTS & PRESETS ────────────────────────────── */
const DEFAULT_MODEL = "models/gemini-3.8-live";
const DEFAULT_VOICE = "Aoede";

const PRESETS = {
  helga: {
    name: "Helga",
    lang: "de-DE",
    voice: "Aoede", // Female voice
    instruction: `You are Helga, an encouraging, friendly, and structured German language teacher.

The user is practicing German at the intermediate (B1/B2) level.
Always transcribe and interpret the user's speech as German, even if their pronunciation is imperfect or contains an accent. Do not transcribe or interpret user speech as other languages.

Rules for your responses:
- Speak exclusively in natural, conversational German suitable for B1/B2 learners.
- Engage in an active, supportive conversation.
- If the user makes a grammatical or vocabulary mistake, briefly and gently correct it, then immediately continue the conversation naturally.
- Answer questions the user asks and propose relevant follow-up questions to keep the dialogue flowing.
- Keep your turns reasonably concise so the learner has maximum speaking time.`
  },
  "jean-paul": {
    name: "Jean-Paul",
    lang: "fr-FR",
    voice: "Charon", // Male voice
    instruction: `You are Jean-Paul, a warm, patient, and articulate French language teacher.

The user is practicing French at the beginner/elementary (A1/A2) level.
Always transcribe and interpret the user's speech as French, even if their pronunciation is accented or incomplete. Do not transcribe or interpret user speech as other languages.

Rules for your responses:
- Speak exclusively in clear, simple French appropriate for A1/A2 level learners (common words, clear syntax, moderate pace).
- Be very patient and encouraging.
- If the user makes a mistake, provide a quick, gentle correction, and continue smoothly.
- Ask simple, clear questions to prompt the learner to respond.
- Keep responses short to give the learner the floor to practice speaking.`
  }
};

/* ── THEME SWITCHER ─────────────────────────────────── */
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  document.getElementById('theme-btn').textContent = isDark ? 'Dark' : 'Light';
  localStorage.setItem('va_theme', newTheme);
}
const savedTheme = localStorage.getItem('va_theme');
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';
}

/* ── ACCORDION TOGGLE ───────────────────────────────── */
function toggleAccordion(btn) {
  const expanded = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!expanded));
  btn.nextElementSibling.classList.toggle('open', !expanded);
}

/* ── SETTINGS PERSISTENCE & PERSONA HANDLING ────────── */
const apiKeyInput = document.getElementById("apiKey");
apiKeyInput.value = localStorage.getItem("va_api_key") || "";
apiKeyInput.addEventListener("change", () => {
  localStorage.setItem("va_api_key", apiKeyInput.value.trim());
});

const personaSelect = document.getElementById("personaSelect");
const langSelect = document.getElementById("langSelect");
const voiceSelect = document.getElementById("voiceSelect");
const promptInput = document.getElementById("systemPrompt");

function applyPersona(personaKey) {
  const preset = PRESETS[personaKey];
  if (!preset) return;

  personaSelect.value = personaKey;
  langSelect.value = preset.lang;
  voiceSelect.value = preset.voice || DEFAULT_VOICE;
  promptInput.value = preset.instruction;

  localStorage.setItem("va_persona", personaKey);
  localStorage.setItem("va_lang", preset.lang);
  localStorage.setItem("va_voice", preset.voice || DEFAULT_VOICE);
  localStorage.setItem("va_prompt", preset.instruction);
}

// Initialize active persona
let savedPersona = localStorage.getItem("va_persona");
if (!PRESETS[savedPersona]) {
  savedPersona = "helga";
}
personaSelect.value = savedPersona;

langSelect.value = localStorage.getItem("va_lang") || PRESETS[savedPersona].lang;
voiceSelect.value = localStorage.getItem("va_voice") || PRESETS[savedPersona].voice || DEFAULT_VOICE;
promptInput.value = localStorage.getItem("va_prompt") || PRESETS[savedPersona].instruction;

personaSelect.addEventListener("change", (e) => {
  applyPersona(e.target.value);
});

langSelect.addEventListener("change", () => {
  localStorage.setItem("va_lang", langSelect.value);
});

voiceSelect.addEventListener("change", () => {
  localStorage.setItem("va_voice", voiceSelect.value);
});

promptInput.addEventListener("input", () => {
  localStorage.setItem("va_prompt", promptInput.value);
});

/* ── VOLUME CONTROL ─────────────────────────────────── */
const volumeControl = document.getElementById("volumeControl");
const volumeVal = document.getElementById("volumeVal");
let playbackGainNode = null;
let currentVolume = parseFloat(localStorage.getItem("va_volume") ?? "100") / 100;
if (isNaN(currentVolume)) currentVolume = 1;

volumeControl.value = Math.round(currentVolume * 100);
volumeVal.textContent = `${volumeControl.value}%`;

volumeControl.addEventListener("input", (e) => {
  const val = parseInt(e.target.value, 10);
  volumeVal.textContent = `${val}%`;
  currentVolume = val / 100;
  localStorage.setItem("va_volume", val);
  if (playbackGainNode && playbackCtx) {
    playbackGainNode.gain.setValueAtTime(currentVolume, playbackCtx.currentTime);
  }
});

/* ── TOASTER ────────────────────────────────────────── */
const TOAST_ICONS = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
const TOAST_CLASSES = { success: 'toast-success', error: 'toast-error', warning: 'toast-warning', info: 'toast-info' };
function toast(type, title, msg, duration = 4000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + (TOAST_CLASSES[type] || 'toast-info');
  el.innerHTML =
    '<div class="toast-body">' +
      '<div class="toast-title">' + (TOAST_ICONS[type] ? TOAST_ICONS[type] + ' ' : '') + title + '</div>' +
      (msg ? '<div class="toast-msg">' + msg + '</div>' : '') +
    '</div>' +
    '<button class="toast-close" onclick="dismissToast(this.parentElement)">×</button>' +
    '<div class="toast-progress" style="animation-duration:' + duration + 'ms"></div>';
  container.appendChild(el);
  const timer = setTimeout(() => dismissToast(el), duration);
  el._timer = timer;
}
function dismissToast(el) {
  if (!el || !el.parentElement) return;
  clearTimeout(el._timer);
  el.classList.add('removing');
  el.addEventListener('animationend', () => el.remove(), { once: true });
}

/* ── APPLICATION STATE ─────────────────────────────── */
let ws = null;
let micStream = null;
let audioContext = null;
let processor = null;
let playbackCtx = null;
let nextPlayTime = 0;
let activeSources = [];

let isConnected = false;
let isSetupComplete = false;
let isAssistantSpeaking = false;

// Pointers to the active streaming speech bubbles
let currentUserMsgEl = null;
let currentAssistantMsgEl = null;

function setStatus(text, dotClass = "") {
  document.getElementById("statusText").innerText = text;
  document.getElementById("statusDot").className = "dot " + dotClass;
}

function getAssistantSpeakerLabel() {
  const currentP = personaSelect.value;
  return PRESETS[currentP] ? PRESETS[currentP].name : 'Assistant';
}

function appendMessage(sender, text = "") {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `msg msg-${sender}`;
  const speakerLabel = sender === 'user' ? 'You' : getAssistantSpeakerLabel();
  msg.innerHTML = `<div class="msg-speaker">${speakerLabel}</div><div class="content">${text}</div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg.querySelector(".content");
}

/* ── SESSION TOGGLE ─────────────────────────────────── */
async function toggleSession() {
  if (isConnected) {
    stopSession();
  } else {
    await startSession();
  }
}

async function startSession() {
  const key = apiKeyInput.value.trim();
  const lang = langSelect.value;
  const currentP = personaSelect.value;
  const voice = voiceSelect ? voiceSelect.value : (PRESETS[currentP]?.voice || DEFAULT_VOICE);
  const instruction = promptInput.value.trim() || (PRESETS[currentP] ? PRESETS[currentP].instruction : "");

  if (!key) {
    toast('warning', 'API Key Missing', 'Please enter your Gemini API key in the settings panel.');
    const trigger = document.getElementById("settingsToggle");
    if (trigger.getAttribute("aria-expanded") !== "true") {
      toggleAccordion(trigger);
    }
    apiKeyInput.focus();
    return;
  }

  setStatus("Starting microphone...", "");
  const toggleBtn = document.getElementById("toggleBtn");
  toggleBtn.innerText = "Connecting...";
  toggleBtn.disabled = true;
  personaSelect.disabled = true;

  try {
    await initMicrophone();
  } catch (err) {
    toast('error', 'Microphone Error', err.message);
    stopSession();
    return;
  }

  setStatus("Connecting...", "");

  const endpoint = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${key}`;
  ws = new WebSocket(endpoint);

  ws.onopen = () => {
    const setupMessage = {
      setup: {
        model: DEFAULT_MODEL,
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: voice }
            }
          }
        },
        inputAudioTranscription: {
          languageCodes: [lang]
        },
        outputAudioTranscription: {},
        systemInstruction: {
          parts: [{ text: instruction }]
        }
      }
    };

    ws.send(JSON.stringify(setupMessage));
    isConnected = true;
    toggleBtn.disabled = false;
    toggleBtn.innerText = "End Conversation";
    toggleBtn.className = "btn btn-danger";
    setStatus("Waiting for server...", "");
  };

  ws.onmessage = async (event) => {
    let msg;
    try {
      if (event.data instanceof Blob) {
        msg = JSON.parse(await event.data.text());
      } else {
        msg = JSON.parse(event.data);
      }
    } catch (e) {
      return;
    }

    if (msg.setupComplete) {
      isSetupComplete = true;
      setStatus("Ready! Speak now", "connected");
      toast('success', 'Connected', 'Conversation session is active.');
      return;
    }

    const serverContent = msg.serverContent;
    if (!serverContent) return;

    // 1. Spoken user transcription
    const userText = serverContent.inputTranscription?.text;
    if (userText && userText.trim()) {
      if (!currentUserMsgEl) {
        currentUserMsgEl = appendMessage("user");
      }
      currentUserMsgEl.textContent += userText;
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    // 2. Audio playback stream
    if (serverContent.modelTurn?.parts) {
      isAssistantSpeaking = true;
      currentUserMsgEl = null;
      setStatus(`${getAssistantSpeakerLabel()} is speaking...`, "speaking");

      for (const part of serverContent.modelTurn.parts) {
        if (part.inlineData?.data) {
          playAudioChunk(part.inlineData.data);
        }
      }
    }

    // 3. Spoken assistant transcription
    const assistantText = serverContent.outputTranscription?.text;
    if (assistantText) {
      currentUserMsgEl = null;
      if (!currentAssistantMsgEl) {
        currentAssistantMsgEl = appendMessage("assistant");
      }
      currentAssistantMsgEl.textContent += assistantText;
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    // Barge-in interruption
    if (serverContent.interrupted) {
      stopAudioPlayback();
      currentAssistantMsgEl = null;
    }

    // Turn complete
    if (serverContent.turnComplete) {
      currentAssistantMsgEl = null;
    }
  };

  ws.onerror = (e) => {
    console.error("WebSocket Error:", e);
  };

  ws.onclose = (event) => {
    console.warn("WebSocket closed:", event.code, event.reason);
    if (event.code !== 1000) {
      toast('error', `Disconnected (${event.code})`, event.reason || 'Check your API key and connection.');
    }
    stopSession();
  };
}

/* ── MICROPHONE AUDIO STREAM ────────────────────────── */
async function initMicrophone() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }

  const source = audioContext.createMediaStreamSource(micStream);
  processor = audioContext.createScriptProcessor(4096, 1, 1);

  const meter = document.getElementById("audioMeter");
  const meterBars = meter.querySelectorAll(".audio-meter-bar");

  processor.onaudioprocess = (e) => {
    const inputData = e.inputBuffer.getChannelData(0);

    let sum = 0;
    for (let i = 0; i < inputData.length; i++) {
      sum += inputData[i] * inputData[i];
    }
    const rms = Math.sqrt(sum / inputData.length);
    const level = Math.min(5, Math.ceil(rms * 120));

    meter.classList.toggle("active", level > 0);
    meterBars.forEach((bar, idx) => {
      bar.style.height = (idx < level) ? `${6 + idx * 2}px` : `4px`;
    });

    if (!isConnected || !isSetupComplete || isAssistantSpeaking || !ws || ws.readyState !== WebSocket.OPEN) {
      return;
    }

    const resampledData = downsample(inputData, audioContext.sampleRate, 16000);
    const pcm16 = floatTo16BitPCM(resampledData);
    const base64Audio = arrayBufferToBase64(pcm16);

    try {
      ws.send(JSON.stringify({
        realtimeInput: {
          audio: {
            mimeType: "audio/pcm;rate=16000",
            data: base64Audio
          }
        }
      }));
    } catch (err) {}
  };

  source.connect(processor);

  const mute = audioContext.createGain();
  mute.gain.value = 0;
  processor.connect(mute);
  mute.connect(audioContext.destination);
}

/* ── AUDIO PLAYBACK (24kHz PCM WITH VOLUME GAIN) ────── */
function playAudioChunk(base64PCM) {
  if (!playbackCtx) {
    playbackCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    playbackGainNode = playbackCtx.createGain();
    playbackGainNode.gain.setValueAtTime(currentVolume, playbackCtx.currentTime);
    playbackGainNode.connect(playbackCtx.destination);
  }
  if (playbackCtx.state === "suspended") {
    playbackCtx.resume();
  }

  const binary = atob(base64PCM);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768.0;
  }

  const audioBuffer = playbackCtx.createBuffer(1, float32.length, 24000);
  audioBuffer.copyToChannel(float32, 0);

  const source = playbackCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(playbackGainNode);

  const now = playbackCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;

  source.start(nextPlayTime);
  nextPlayTime += audioBuffer.duration;

  activeSources.push(source);
  source.onended = () => {
    activeSources = activeSources.filter(s => s !== source);
    if (activeSources.length === 0 && nextPlayTime <= playbackCtx.currentTime + 0.05) {
      isAssistantSpeaking = false;
      setStatus("Ready! Speak now", "connected");
    }
  };
}

function stopAudioPlayback() {
  activeSources.forEach(s => { try { s.stop(); } catch(e){} });
  activeSources = [];
  if (playbackCtx) nextPlayTime = playbackCtx.currentTime;
  isAssistantSpeaking = false;
}

function stopSession() {
  isConnected = false;
  isSetupComplete = false;
  isAssistantSpeaking = false;
  currentUserMsgEl = null;
  currentAssistantMsgEl = null;

  stopAudioPlayback();

  const meter = document.getElementById("audioMeter");
  meter.classList.remove("active");
  meter.querySelectorAll(".audio-meter-bar").forEach(b => b.style.height = "4px");

  if (processor) {
    processor.onaudioprocess = null;
    processor.disconnect();
    processor = null;
  }
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (ws) {
    ws.onclose = null;
    ws.onerror = null;
    ws.close();
    ws = null;
  }

  const toggleBtn = document.getElementById("toggleBtn");
  toggleBtn.disabled = false;
  toggleBtn.innerText = "Start Conversation";
  toggleBtn.className = "btn btn-primary";
  personaSelect.disabled = false;
  setStatus("Disconnected", "");
}

/* ── AUDIO CONVERSIONS ──────────────────────────────── */
function downsample(buffer, fromRate, toRate) {
  if (fromRate === toRate) return buffer;
  const ratio = fromRate / toRate;
  const newLength = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLength);
  for (let i = 0; i < newLength; i++) {
    result[i] = buffer[Math.min(Math.round(i * ratio), buffer.length - 1)];
  }
  return result;
}

function floatTo16BitPCM(input) {
  const buffer = new ArrayBuffer(input.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < input.length; i++) {
    let s = Math.max(-1, Math.min(1, input[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

function arrayBufferToBase64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}
